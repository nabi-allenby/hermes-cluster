apiVersion: v2
name: hermes-cluster
description: >-
  Personal Hermes agent sessions on Kubernetes: the hermes-relay-connector
  (Discord front, durable buffer, wake pokes), the lifecycle-manager
  (session CRUD, idle/TTL sweepers), and the session SandboxTemplate/WarmPool
  for kubernetes-sigs/agent-sandbox. CRDs/controller for agent-sandbox are a
  prerequisite and install from the upstream release manifest (see README).
type: application
version: 0.2.2
appVersion: "0.1.0"
keywords: [hermes, agents, discord, agent-sandbox, scale-to-zero]
sources:
  - https://github.com/nabi-allenby/hermes-cluster
  - https://github.com/nabi-allenby/hermes-relay-connector
