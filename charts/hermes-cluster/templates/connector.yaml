# hermes-relay-connector: single replica over a SQLite buffer PVC, so the
# strategy MUST stay Recreate. The image is FROM scratch, non-root (65532);
# fsGroup makes the PVC writable. Do not override HRC_DB: /data is the only
# writable path in the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-relay-connector
  labels: {app.kubernetes.io/name: relay-connector, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: relay-connector, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: relay-connector, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: relay-connector
          image: {{ .Values.connector.image }}
          imagePullPolicy: {{ .Values.connector.imagePullPolicy }}
          env:
            - name: HRC_LISTEN
              value: 0.0.0.0:8420
            - name: HRC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "hc.tokensSecretName" . }}, key: admin-token}
            - name: HRC_PROVISION_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "hc.tokensSecretName" . }}, key: provision-token}
            {{- if .Values.connector.discordTokenSecret }}
            - name: HRC_DISCORD_TOKEN_FILE
              value: /run/secrets/discord.token
            {{- end }}
            - name: HRC_WAKE_COOLDOWN_SECS
              value: {{ .Values.connector.wakeCooldownSeconds | quote }}
            {{- with .Values.connector.provisioning.allowedUserIds }}
            - name: HRC_ALLOWED_USERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.connector.provisioning.enabled }}
            - name: HRC_DISCORD_PROVISION
              value: "1"
            - name: HRC_LM_URL
              value: {{ include "hc.wakeBaseURL" . }}
            - name: HRC_PROVISION_IDLE_SECS
              value: {{ .Values.connector.provisioning.idleTimeoutSeconds | quote }}
            - name: HRC_PROVISION_TTL_SECS
              value: {{ .Values.connector.provisioning.ttlSeconds | quote }}
            {{- if .Values.lifecycleManager.apiTokenSecret }}
            - name: HRC_LM_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.lifecycleManager.apiTokenSecret }}, key: token}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            # /dashboard slash command: per-session URL, {session} substituted
            # by the connector. Matches the LM's per-session Ingress host.
            - name: HRC_DASHBOARD_URL_TEMPLATE
              value: "https://{session}.{{ .Values.dashboard.domain }}"
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 8420
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.connector.discordTokenSecret }}
            - name: discord
              mountPath: /run/secrets
              readOnly: true
            {{- end }}
          readinessProbe:
            # The admin plane has no /healthz; /metrics is unauthenticated by
            # design and is the documented reachability probe.
            httpGet: {path: /metrics, port: 8420}
            initialDelaySeconds: 1
            periodSeconds: 5
          resources: {{- toYaml .Values.connector.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-relay-connector-buffer
        {{- if .Values.connector.discordTokenSecret }}
        - name: discord
          secret:
            secretName: {{ .Values.connector.discordTokenSecret }}
            items:
              - key: token
                path: discord.token
        {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-relay-connector-buffer
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.connector.buffer.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.connector.buffer.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-relay-connector
spec:
  selector: {app.kubernetes.io/name: relay-connector, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - port: 8420
      targetPort: 8420
