{{- if and .Values.session.serve.enabled (not .Values.session.serve.existingAuthSecret) }}
# Throwaway basic-auth credential for the sessions' serve container (issue
# #2): `hermes serve` refuses non-loopback binds without an auth provider,
# and the lifecycle-manager logs in with the same credential to read the
# auth-gated cron schedule. Nothing else needs it; nobody types it.
{{- $name := include "hc.dashboardAuthSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # Keep the generated credential stable across `helm upgrade`.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $existing }}
  username: {{ index $existing.data "username" }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  username: {{ "ops" | b64enc }}
  password: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
