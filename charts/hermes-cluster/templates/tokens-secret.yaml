{{- if not .Values.connector.existingTokensSecret }}
{{- $name := include "hp.tokensSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    # Keep generated tokens stable across `helm upgrade`.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if $existing }}
  admin-token: {{ index $existing.data "admin-token" }}
  provision-token: {{ index $existing.data "provision-token" }}
  {{- else }}
  admin-token: {{ randAlphaNum 48 | b64enc }}
  provision-token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
