# The session recipe (docs/architecture.md) as chart resources. Requires the
# agent-sandbox CRDs/controller (upstream release manifest;
# test/env/minikube-up.sh installs them locally) — deliberately NOT part of
# this chart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hermes-bootstrap
data:
  bootstrap.py: |
{{ .Files.Get "files/bootstrap.py" | indent 4 }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ .Values.session.templateName }}
spec:
  envVarsInjectionPolicy: Disallowed
  podTemplate:
    spec:
      # agent-sandbox v0.5.4 defaults sandbox pods to dnsPolicy None with
      # public resolvers when the template is silent; ClusterFirst is
      # required to resolve the connector Service (docs/agent-sandbox.md).
      dnsPolicy: ClusterFirst
      terminationGracePeriodSeconds: {{ .Values.session.terminationGracePeriodSeconds }}
      {{- with .Values.session.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.session.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.session.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: seed-home
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              # 10000:10000 is the image's baked-in hermes user; its boot
              # hook chowns only known subdirs, never top-level files.
              for b in .env auth.json config.yaml SOUL.md; do
                if [ -e "/seed/$b" ] && [ ! -e "/opt/data/$b" ]; then
                  cp -L "/seed/$b" "/opt/data/$b"
                  chmod 600 "/opt/data/$b"
                  chown 10000:10000 "/opt/data/$b"
                  echo "seeded $b"
                fi
              done
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: agent
          image: {{ .Values.session.image }}
          imagePullPolicy: {{ .Values.session.imagePullPolicy }}
          args:
            - sh
            - -c
            - |
              set -eu
              export HERMES_SESSION_ID="${HERMES_SESSION_ID:-$(hostname)}"
              python /run/hermes/bootstrap.py
              exec hermes gateway run --replace
          env:
            - name: HERMES_SESSION_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HERMES_RELAY_URL
              value: {{ include "hc.connectorURL" . }}
            - name: HERMES_RELAY_BOT_ID
              value: {{ .Values.session.botId | quote }}
          volumeMounts:
            - name: home
              mountPath: /opt/data
            - name: provision
              mountPath: /run/hermes
              readOnly: true
          resources: {{- toYaml .Values.session.resources | nindent 12 }}
        {{- if .Values.session.serve.enabled }}
        # Serve container (issue #2): the same image running `hermes serve`
        # against the shared home. Its /api/status is the agent-reported
        # activity surface the lifecycle-manager's Idle v2 sweeper polls
        # (public even when the auth gate is on). Upstream refuses a
        # non-loopback bind without an auth provider — see the two auth
        # modes below.
        - name: serve
          image: {{ .Values.session.image }}
          imagePullPolicy: {{ .Values.session.imagePullPolicy }}
          args:
            - sh
            - -c
            - exec hermes serve --host 0.0.0.0 --port {{ .Values.session.serve.port }}
          env:
            {{- if .Values.dashboard.enabled }}
            # Dashboard mode: OIDC only, single shared broker app (Auth0).
            # No platform-held credential exists for a user's agent — a
            # shared basic-auth secret would be operator backdoor access,
            # and a second session provider breaks Hermes Desktop's native
            # login (it auto-selects only with exactly ONE session
            # provider). Every session uses the SAME client id, so it comes
            # from a value here — per-session authorization lives in the
            # broker's post-login Action, not in per-session app ids.
            - name: HERMES_SESSION_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: {{ .Values.dashboard.oidcIssuer | quote }}
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: {{ .Values.dashboard.oidcClientId | quote }}
            - name: HERMES_DASHBOARD_OIDC_SCOPES
              value: {{ .Values.dashboard.oidcScopes | quote }}
            # Mandatory behind the ingress: redirect_uri derives from this,
            # not from proxy headers (verified upstream).
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://$(HERMES_SESSION_ID).{{ .Values.dashboard.domain }}"
            {{- else }}
            # Non-dashboard installs: the chart-held basic credential is the
            # bind-guard auth provider and the lifecycle-manager's cron-read
            # login (Idle v2 cron guard).
            - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ include "hc.dashboardAuthSecretName" . }}, key: username}
            - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "hc.dashboardAuthSecretName" . }}, key: password}
            {{- end }}
          ports:
            - containerPort: {{ .Values.session.serve.port }}
          volumeMounts:
            - name: home
              mountPath: /opt/data
          resources: {{- toYaml .Values.session.serve.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: seed
          secret:
            secretName: {{ .Values.session.homeSeedSecret }}
        - name: provision
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: {{ include "hc.tokensSecretName" . }}
                  items:
                    - key: provision-token
                      path: provision-token
              - configMap:
                  name: {{ .Release.Name }}-hermes-bootstrap
                  items:
                    - key: bootstrap.py
                      path: bootstrap.py
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.session.home.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.session.home.size }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ .Values.session.warmPoolName }}
spec:
  # gatewayId == pod == claim name only holds on cold starts; warm-pool
  # adoption breaks that identity, so keep replicas at 0 until the session
  # recipe carries identity differently.
  replicas: {{ .Values.session.warmReplicas }}
  sandboxTemplateRef:
    name: {{ .Values.session.templateName }}
