apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-lifecycle-manager
---
# The exact minimal RBAC — claims (full lifecycle) + sandboxes (patch), both
# API groups, nothing else. Mirrors test/fixtures/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-lifecycle-manager
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-lifecycle-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-lifecycle-manager
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-lifecycle-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lifecycle-manager
  labels: {app.kubernetes.io/name: lifecycle-manager, app.kubernetes.io/instance: {{ .Release.Name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lifecycle-manager, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lifecycle-manager, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ .Release.Name }}-lifecycle-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lifecycle-manager
          image: {{ .Values.lifecycleManager.image }}
          imagePullPolicy: {{ .Values.lifecycleManager.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: HLM_LISTEN
              value: ":{{ .Values.lifecycleManager.listenPort }}"
            - name: HLM_WARM_POOL
              value: {{ .Values.session.warmPoolName }}
            - name: HLM_CONNECTOR_ENABLED
              value: "true"
            - name: HLM_CONNECTOR_URL
              value: {{ include "hc.connectorURL" . }}
            - name: HLM_CONNECTOR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "hc.tokensSecretName" . }}, key: admin-token}
            - name: HLM_CONNECTOR_PROVISION_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ include "hc.tokensSecretName" . }}, key: provision-token}
            - name: HLM_CONNECTOR_BOT_ID
              value: {{ .Values.session.botId | quote }}
            - name: HLM_WAKE_BASE_URL
              value: {{ include "hc.wakeBaseURL" . }}
            - name: HLM_SWEEP_INTERVAL
              value: {{ .Values.lifecycleManager.sweepInterval | quote }}
            - name: HLM_IDLE_TIMEOUT
              value: {{ .Values.lifecycleManager.idleTimeout | quote }}
            - name: HLM_TTL
              value: {{ .Values.lifecycleManager.ttl | quote }}
            {{- if .Values.lifecycleManager.apiTokenSecret }}
            - name: HLM_API_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.lifecycleManager.apiTokenSecret }}, key: token}
            {{- else if .Values.lifecycleManager.apiToken }}
            - name: HLM_API_TOKEN
              value: {{ .Values.lifecycleManager.apiToken | quote }}
            {{- end }}
            - name: HLM_LOG_LEVEL
              value: {{ .Values.lifecycleManager.logLevel }}
          ports:
            - containerPort: {{ .Values.lifecycleManager.listenPort }}
          readinessProbe:
            httpGet: {path: /readyz, port: {{ .Values.lifecycleManager.listenPort }}}
            initialDelaySeconds: 1
            periodSeconds: 5
          resources: {{- toYaml .Values.lifecycleManager.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lifecycle-manager
spec:
  selector: {app.kubernetes.io/name: lifecycle-manager, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports:
    - port: {{ .Values.lifecycleManager.listenPort }}
      targetPort: {{ .Values.lifecycleManager.listenPort }}
