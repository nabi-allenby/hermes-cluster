# hermes-cluster chart values. Cloud-specific knobs (storageClass, identity
# annotations, scheduling) are values; cloud resources belong to whatever
# provisions your cluster.

connector:
  image: ghcr.io/nabi-allenby/hermes-relay-connector:0.5.0
  imagePullPolicy: IfNotPresent
  # Discord bot token Secret (key: token), created out of band. Empty =>
  # connector runs without Discord (echo/relay only — useful for dev
  # clusters).
  discordTokenSecret: relay-connector-discord-token
  # Admin/provision tokens: generated on first install and reused on upgrade.
  # Set existingTokensSecret to bring your own (keys: admin-token,
  # provision-token).
  existingTokensSecret: ""
  wakeCooldownSeconds: 60
  # Discord self-provisioning: allowlisted users create their own agent
  # session with /provision and attach channels with /bind (/unbind).
  # Enabling switches routing to STRICT binding-only — unbound chats drop
  # fail-closed instead of falling back to the single registered gateway.
  provisioning:
    enabled: false
    # Discord user ids allowed to talk to the bot AT ALL (ingress author
    # gate) and to run the provisioning commands. Empty = no author gate.
    allowedUserIds: []
    idleTimeoutSeconds: 1800
    ttlSeconds: 0
  buffer:
    size: 1Gi
    storageClass: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

lifecycleManager:
  image: ghcr.io/nabi-allenby/hermes-cluster/lifecycle-manager:0.2.0
  imagePullPolicy: IfNotPresent
  listenPort: 8080
  sweepInterval: 60s
  idleTimeout: 30m
  ttl: "0"
  # Optional bearer on /v1/* (never /wake). Prefer apiTokenSecret — the name
  # of a Secret with key `token`; apiToken embeds the value in the rendered
  # manifest and is for dev only. Both empty disables the guard.
  apiToken: ""
  apiTokenSecret: ""
  logLevel: info
  # Idle v2 (issue #2): suspend decisions poll each session's serve container
  # (/api/status) for agent-reported activity — relay silence alone never
  # suspends. Requires session.serve.enabled; disable both to fall back to
  # the v1 connector-only sweeper.
  statusPoll:
    enabled: true
    # A cron fire within this window blocks the suspend entirely.
    idleHorizon: 5m
    # Scheduled wakes fire this early so the gateway is up when cron ticks.
    wakeBootMargin: 2m
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

session:
  # Official multi-arch image (amd64+arm64). Pin a release tag or digest —
  # never a floating tag; the relay contract was conformance-verified around
  # NousResearch/hermes-agent@244d296 (v2026.8.3 is the nearest release).
  image: nousresearch/hermes-agent:v2026.8.3
  imagePullPolicy: IfNotPresent
  templateName: hermes-session
  warmPoolName: hermes-pool
  warmReplicas: 0
  # First-boot seed Secret with keys: .env, auth.json, config.yaml, SOUL.md
  # (see test/drills/1-agent-session/make-seed.sh). Holds the LLM key — created out of band.
  homeSeedSecret: hermes-home-seed
  botId: dev-bot
  home:
    size: 10Gi
    storageClass: ""
  terminationGracePeriodSeconds: 30
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
  # Pin sessions to a dedicated (e.g. Spot) pool. The AKS Spot pool is
  # tainted kubernetes.azure.com/scalesetpriority=spot:NoSchedule — without
  # this toleration sessions never schedule there.
  nodeSelector: {}
  tolerations: []
  # e.g. [{name: acr-pull}] for a private registry the nodes can't reach
  # via identity (kubernetes.io/dockerconfigjson Secret, created out of band).
  imagePullSecrets: []
  # Serve container: `hermes serve` beside the gateway, sharing its home
  # volume. It is the Idle v2 activity surface the lifecycle-manager polls
  # (/api/status is public; the cron schedule needs the basic-auth secret
  # below) and, later, the desktop-access dashboard (issue #1). Upstream
  # refuses non-loopback binds without an auth provider, hence the
  # throwaway basic-auth credential even with no public exposure.
  serve:
    enabled: true
    port: 9119
    # BYO Secret with keys `username` and `password`; empty generates one
    # on first install and reuses it across upgrades.
    existingAuthSecret: ""
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      limits: {cpu: 500m, memory: 512Mi}

networkPolicy:
  # Default-on. Requires a CNI that enforces NetworkPolicy (AKS: Azure CNI /
  # Cilium; plain minikube docker driver does not enforce — rules are inert
  # there, not harmful).
  enabled: true
