# Dev connector for the agent-session drill: in-cluster, single plane, no
# Discord token (the echo API stands in for Discord). Buffer DB on an
# emptyDir -- this is a drill fixture; the chart gives it a PVC.
#
# Image: relay-connector:e2e (docker build -t relay-connector:e2e <hermes-relay-connector checkout>),
# loaded into
# minikube by run.sh. The v0.2.0 image is FROM scratch and non-root (65532);
# fsGroup makes /data writable. Do NOT override HRC_DB -- /data is the only
# writable path in the image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-connector
  labels: {app: relay-connector}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: relay-connector}
  template:
    metadata:
      labels: {app: relay-connector}
    spec:
      securityContext:
        fsGroup: 65532
      containers:
        - name: relay-connector
          image: relay-connector:e2e
          imagePullPolicy: Never
          env:
            - name: HRC_LISTEN
              value: 0.0.0.0:8420
            - name: HRC_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: relay-connector-tokens, key: admin-token}
            - name: HRC_PROVISION_TOKEN
              valueFrom:
                secretKeyRef: {name: relay-connector-tokens, key: provision-token}
            - name: HRC_WAKE_COOLDOWN_SECS
              value: "15"
          ports:
            - containerPort: 8420
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            # The admin plane has no /healthz; /metrics is unauthenticated by
            # design and is the documented reachability probe.
            httpGet: {path: /metrics, port: 8420}
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-connector
spec:
  selector: {app: relay-connector}
  ports:
    - port: 8420
      targetPort: 8420
