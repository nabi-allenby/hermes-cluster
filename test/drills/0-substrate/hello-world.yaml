# Substrate-drill hello-world: template + empty warm pool + one claim.
# The busybox pod writes a marker to its PVC and sleeps; suspend/resume must
# preserve the marker (kubectl exec cat /data/marker).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: hello-world
spec:
  envVarsInjectionPolicy: Disallowed
  podTemplate:
    spec:
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f /data/marker ]; then
                echo "born $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /data/marker
              fi
              echo "marker: $(cat /data/marker)"
              sleep infinity
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: hello-world
spec:
  replicas: 0 # cold-start everything; pool exists only so claims can reference it
  sandboxTemplateRef:
    name: hello-world
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxClaim
metadata:
  name: hello-1
spec:
  warmPoolRef:
    name: hello-world
