# e2e session template + pool (busybox stand-in for the Hermes image).
# terminationGracePeriodSeconds is short because busybox's `sleep` ignores
# SIGTERM; without it every suspend waits out the full 30 s default.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: e2e-session
spec:
  envVarsInjectionPolicy: Disallowed
  podTemplate:
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f /data/marker ]; then
                echo "born $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /data/marker
              fi
              sleep infinity
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: e2e-pool
spec:
  replicas: 0
  sandboxTemplateRef:
    name: e2e-session
