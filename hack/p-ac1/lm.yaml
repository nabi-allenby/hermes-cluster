# P-AC1 lifecycle-manager, in-cluster (its first in-cluster run — the same
# topology the P-M3 chart will template). RBAC comes from hack/e2e/rbac.yaml,
# applied by run.sh. Image: local `make image` build, loaded into minikube.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlm
  labels: {app: hlm}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hlm}
  template:
    metadata:
      labels: {app: hlm}
    spec:
      serviceAccountName: lifecycle-manager
      containers:
        - name: hlm
          image: ghcr.io/nabi-allenby/hermes-cluster/lifecycle-manager:dev
          imagePullPolicy: Never
          env:
            - name: HLM_WARM_POOL
              value: hermes-pool
            - name: HLM_CONNECTOR_ENABLED
              value: "true"
            - name: HLM_CONNECTOR_URL
              value: http://hrc:8420
            - name: HLM_CONNECTOR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: hrc-tokens, key: admin-token}
            - name: HLM_CONNECTOR_PROVISION_TOKEN
              valueFrom:
                secretKeyRef: {name: hrc-tokens, key: provision-token}
            - name: HLM_CONNECTOR_BOT_ID
              # Replace with YOUR Discord application/bot id.
              value: "1536119976094859394"
            - name: HLM_WAKE_BASE_URL
              value: http://hlm:8080
            - name: HLM_SWEEP_INTERVAL
              value: 30s
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: hlm
spec:
  selector: {app: hlm}
  ports:
    - port: 8080
      targetPort: 8080
