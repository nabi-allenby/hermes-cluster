# Builds the hermes-agent image on a native amd64 runner and pushes it to
# GHCR (free — replaces a paid cloud registry). No official hermes-agent
# image exists; this is the platform's one required image-build step.
# Make the resulting package public so AKS pulls anonymously, or wire an
# imagePullSecret.
name: agent-image
on:
  workflow_dispatch:
    inputs:
      hermes_ref:
        description: NousResearch/hermes-agent git ref to build
        required: true
        default: "244d296"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ github.event.inputs.hermes_ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/hermes-agent:${{ github.event.inputs.hermes_ref }}
          cache-from: type=gha,scope=agent-image
          cache-to: type=gha,scope=agent-image,mode=max
