name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: lifecycle-manager/go.mod
          cache-dependency-path: lifecycle-manager/go.sum
      - name: vet
        run: cd lifecycle-manager && go vet ./...
      - name: unit tests
        run: cd lifecycle-manager && go test -race ./...

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint + render
        run: |
          helm lint charts/hermes-cluster
          helm template t charts/hermes-cluster >/dev/null

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/lifecycle-manager
          tags: |
            type=sha
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: lifecycle-manager
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # The Dockerfile cross-compiles from $BUILDPLATFORM, so both arches
          # build natively; the cache keeps the module-download layer warm.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      # Tier 2 pulls the published connector image; without access it skips
      # cleanly, so this login is best-effort enablement, not a requirement.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: lifecycle-manager/go.mod
          cache-dependency-path: lifecycle-manager/go.sum
      - name: start minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          driver: docker
      - name: install agent-sandbox
        run: test/env/minikube-up.sh
      - name: tier 0 (substrate suspend/resume loop)
        run: test/drills/0-substrate/run.sh
      - name: e2e tests
        run: cd lifecycle-manager && go test -tags e2e -count=1 -timeout 20m ./e2e/...
