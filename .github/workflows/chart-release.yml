# Publishes charts/hermes-cluster as an OCI artifact on chart-v* tags
# (design §9: chart releases are an independent line from lifecycle-manager
# v* releases). Pull with:
#   helm install hermes oci://ghcr.io/nabi-allenby/hermes-cluster/charts/hermes-cluster --version <x.y.z>
name: chart-release
on:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint + package + push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#chart-v}"
          grep -q "^version: ${version}$" charts/hermes-cluster/Chart.yaml \
            || { echo "Chart.yaml version does not match tag ${TAG}"; exit 1; }
          helm lint charts/hermes-cluster
          helm package charts/hermes-cluster
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push "hermes-cluster-${version}.tgz" oci://ghcr.io/${{ github.repository }}/charts
