# The RBAC a TokenReview-verifying connector needs: its own ServiceAccount
# plus create on authentication.k8s.io/tokenreviews. This is the complete
# privilege set — no read access to pods, secrets, or anything else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t01-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: t01-tokenreview-creator
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: t01-connector-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: t01-tokenreview-creator
subjects:
  - kind: ServiceAccount
    name: t01-connector
    namespace: default
