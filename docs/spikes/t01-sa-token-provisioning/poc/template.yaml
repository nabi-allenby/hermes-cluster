# T01 spike PoC — modified copy of test/fixtures/template.yaml proving that
# agent-sandbox v0.5.4 SandboxTemplate.podTemplate.spec passes through
# `serviceAccountName` and a `serviceAccountToken` projected volume source
# (audience + expirationSeconds). Spike evidence only — NOT production code.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: t01-session
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: t01-session
spec:
  envVarsInjectionPolicy: Disallowed
  podTemplate:
    spec:
      terminationGracePeriodSeconds: 2
      serviceAccountName: t01-session
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "sa-token volume contents:"; ls -l /run/hermes/
              sleep infinity
          volumeMounts:
            - name: sa-token
              mountPath: /run/hermes
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
      volumes:
        - name: sa-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  audience: hermes-relay-connector
                  expirationSeconds: 600
                  path: token
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: t01-pool
spec:
  replicas: 0
  sandboxTemplateRef:
    name: t01-session
---
# Warm pool with a live spare, for the Q4 adoption evidence (pod name vs
# claim name divergence).
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: t01-pool-warm
spec:
  replicas: 1
  sandboxTemplateRef:
    name: t01-session
